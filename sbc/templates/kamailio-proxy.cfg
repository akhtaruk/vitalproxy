#!KAMAILIO
# Single LAN IPv4 UDP outbound proxy. It does not anchor media or register users.
debug=2
log_stderror=no
fork=yes
children=4
auto_aliases=no
disable_tcp=yes
listen=udp:@@proxy_ip@@:@@proxy_port@@
server_signature=no

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "siputils.so"
loadmodule "textops.so"
loadmodule "ipops.so"
modparam("rr", "enable_double_rr", 0)
modparam("tm", "fr_timer", 10000)
modparam("tm", "fr_inv_timer", 120000)

request_route {
    if (!sanity_check("1511", "7")) { exit; }
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too many hops");
        exit;
    }
    force_rport();
    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    if (!is_method("ACK")) {
        if (t_precheck_trans()) { t_check_trans(); exit; }
        t_check_trans();
    }

    # Phones may send SIP only to the configured PBX, never to arbitrary hosts.
    if (is_in_subnet("$si", "@@lan_cidr@@")) {
        if (!is_method("REGISTER|INVITE|ACK|BYE|CANCEL|OPTIONS|UPDATE|PRACK|INFO|REFER|NOTIFY|SUBSCRIBE|MESSAGE")) {
            sl_send_reply("405", "Method not permitted");
            exit;
        }
        if (!has_totag() && is_method("INVITE|SUBSCRIBE|REFER")) {
            record_route();
        }
        $du = "sip:@@pbx_ip@@:@@pbx_sip_port@@;transport=udp";
        force_send_socket(udp:@@proxy_ip@@:@@proxy_port@@);
        if (!t_relay()) { sl_reply_error(); }
        exit;
    }

    # Forward only in-dialog requests from the configured PBX back to LAN phones.
    if (src_ip == @@pbx_ip@@ && loose_route()) {
        if (!is_in_subnet("$rd", "@@lan_cidr@@")) {
            sl_send_reply("403", "Destination outside phone LAN");
            exit;
        }
        $du = $ru;
        force_send_socket(udp:@@proxy_ip@@:@@proxy_port@@);
        if (!t_relay()) { sl_reply_error(); }
        exit;
    }
    sl_send_reply("403", "Source not permitted");
    exit;
}
