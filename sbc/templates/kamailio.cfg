#!KAMAILIO
# Single-site IPv4 UDP SIP edge. PBX retains extension authentication.
debug=2
log_stderror=no
fork=yes
children=4
auto_aliases=no
mhomed=1
enable_tcp=no
listen=udp:@@lan_ip@@:@@sbc_sip_port@@
listen=udp:@@local_tunnel_ip@@:@@sbc_sip_port@@
server_signature=no
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "ipops.so"
loadmodule "rtpengine.so"
loadmodule "pike.so"
modparam("rr", "enable_double_rr", 2)
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("tm", "fr_timer", 10000)
modparam("tm", "fr_inv_timer", 120000)
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 200)
modparam("pike", "remove_latency", 120)

request_route {
    # Trust only the voice LAN on the LAN listener or the PBX on WireGuard.
    if (src_ip == @@pbx_ip@@ && dst_ip == @@local_tunnel_ip@@) {
        $var(from_pbx) = 1;
    } else if (is_in_subnet("$si", "@@lan_cidr@@") && dst_ip == @@lan_ip@@) {
        $var(from_pbx) = 0;
        if (!pike_check_req()) {
            sl_send_reply("503", "Rate limit");
            exit;
        }
    } else {
        sl_send_reply("403", "Source not permitted");
        exit;
    }
    if (!sanity_check("1511", "7")) { exit; }
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too many hops");
        exit;
    }
    force_rport();
    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    if (!is_method("ACK")) {
        if (t_precheck_trans()) { t_check_trans(); exit; }
        t_check_trans();
    }
    if (!is_method("REGISTER|INVITE|ACK|BYE|CANCEL|OPTIONS|UPDATE|PRACK|INFO|REFER|NOTIFY|SUBSCRIBE|MESSAGE")) {
        sl_send_reply("405", "Method not permitted");
        exit;
    }
    if (loose_route()) {
        # Route headers are untrusted input, even from a phone on the LAN.
        route(DESTINATION);
        route(MEDIA);
        route(RELAY);
        exit;
    }
    if (has_totag()) {
        if (is_method("ACK") && t_check_trans()) { t_relay(); exit; }
        sl_send_reply("404", "No dialog route");
        exit;
    }
    if ($var(from_pbx) == 1) {
        # New PBX calls must carry the Path learned during REGISTER.
        sl_send_reply("403", "PBX must use registered Path");
        exit;
    }
    $du = "sip:@@pbx_ip@@:@@pbx_sip_port@@;transport=udp";
    force_send_socket(udp:@@local_tunnel_ip@@:@@sbc_sip_port@@);
    if (is_method("REGISTER")) {
        # Static tunnel-reachable Path; never trust client-provided Path.
        remove_hf("Path");
        append_hf("Path: <sip:@@local_tunnel_ip@@:@@sbc_sip_port@@;lr>\r\n");
        append_hf("Supported: path\r\n");
    } else if (is_method("INVITE|SUBSCRIBE|REFER")) {
        record_route();
    }
    route(MEDIA);
    route(RELAY);
}

route[DESTINATION] {
    if ($var(from_pbx) == 1) {
        # Baseline phones use literal LAN IPv4 Contact addresses, not hostnames.
        if (!is_in_subnet("$rd", "@@lan_cidr@@")) {
            sl_send_reply("403", "Destination outside voice LAN");
            exit;
        }
        # Ignore any additional user-supplied Route destination.
        $du = $ru;
        force_send_socket(udp:@@lan_ip@@:@@sbc_sip_port@@);
    } else {
        $du = "sip:@@pbx_ip@@:@@pbx_sip_port@@;transport=udp";
        force_send_socket(udp:@@local_tunnel_ip@@:@@sbc_sip_port@@);
    }
    if (!has_totag() && is_method("INVITE|SUBSCRIBE|REFER")) { record_route(); }
}

route[MEDIA] {
    if (is_method("BYE")) { rtpengine_delete(); }
    if (has_body("application/sdp")) {
        if ($var(from_pbx) == 1) {
            if (!rtpengine_manage("replace-origin replace-session-connection ICE=remove direction=wg direction=lan")) {
                sl_send_reply("503", "Media relay unavailable");
                exit;
            }
        } else {
            if (!rtpengine_manage("replace-origin replace-session-connection ICE=remove direction=lan direction=wg")) {
                sl_send_reply("503", "Media relay unavailable");
                exit;
            }
        }
    }
}

route[RELAY] {
    t_on_reply("MEDIA_REPLY");
    t_on_failure("MEDIA_FAILURE");
    if (!t_relay()) {
        if (is_method("INVITE")) { rtpengine_delete(); }
        sl_reply_error();
    }
    exit;
}

onreply_route[MEDIA_REPLY] {
    # Do not drop REGISTER 401/407 challenges: they have no media session.
    if (is_method("INVITE") && status =~ "[3-6][0-9][0-9]") {
        rtpengine_delete();
    }
    if (has_body("application/sdp")) {
        if (!rtpengine_manage("replace-origin replace-session-connection ICE=remove")) {
            drop;
        }
    }
}

failure_route[MEDIA_FAILURE] {
    if (is_method("INVITE")) { rtpengine_delete(); }
}
